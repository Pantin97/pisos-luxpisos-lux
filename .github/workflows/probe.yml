name: Sonda fuentes
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python tools/probe.py | tee probe/_log.txt || true
      - name: Publicar en rama probe-data
        run: |
          mkdir -p /tmp/out && cp -r probe/. /tmp/out/
          git config user.name "pisos-bot"; git config user.email "pisos-bot@users.noreply.github.com"
          git checkout --orphan probe-data
          git rm -rfq . && cp -r /tmp/out/. . && git add -A
          git commit -qm "probe $(date -u +%FT%T)" && git push -f origin probe-data
