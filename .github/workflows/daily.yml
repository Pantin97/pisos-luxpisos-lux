name: Pisos diarios

on:
  schedule:
    - cron: "47 5 * * *"        # completo cada mañana: 07:47 en verano / 06:47 en invierno
    - cron: "13 8-20/2 * * *"   # rápido cada 2 h de 10:13 a 22:13 (verano), para avisar de chollos al momento
  workflow_dispatch:        # botón "Escanear" de la app, o "Run workflow" en GitHub
    inputs:
      mode:
        description: "quick = solo lo más reciente (≈1 min) · full = todo y detecta retirados (≈4 min)"
        type: choice
        options: [quick, full]
        default: quick
      notify:
        description: "Enviar notificación si hay pisos nuevos"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pisos-diarios
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: python tests/test_all.py

      - name: Escanear portales, puntuar y avisar
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "47 5 * * *" ]; then MODE=full; else MODE=quick; fi
            FLAGS=""
          else
            MODE="${{ inputs.mode }}"
            FLAGS=""
            if [ "${{ inputs.notify }}" != "true" ]; then FLAGS="--no-notify"; fi
          fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          python -m backend.run --mode "$MODE" $FLAGS

      - name: Guardar resultados
        run: |
          git config user.name "pisos-bot"
          git config user.email "pisos-bot@users.noreply.github.com"
          git add docs/listings.json data/history_v2.json data/geocache.json
          git diff --cached --quiet && exit 0
          git commit -m "Escaneo $MODE $(date -u +%F' '%H:%M)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
