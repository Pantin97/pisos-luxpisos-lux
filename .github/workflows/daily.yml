name: Pisos diarios

on:
  schedule:
    - cron: "47 5 * * *"   # 07:47 en verano / 06:47 en invierno (hora de Luxemburgo)
  workflow_dispatch: {}     # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: pisos-diarios
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: python tests/test_all.py

      - name: Leer alertas, puntuar y avisar
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m backend.run

      - name: Guardar resultados
        run: |
          git config user.name "pisos-bot"
          git config user.email "pisos-bot@users.noreply.github.com"
          git add docs/listings.json data/
          git diff --cached --quiet || git commit -m "Actualización diaria $(date -u +%F)"
          git push
