# ─────────────────────────────────────────────────────────────
#  Pisos Lux — configuración
#  Todo lo que afina la puntuación está aquí. Cambia, haz commit,
#  y la siguiente ejecución diaria lo usa.
# ─────────────────────────────────────────────────────────────

search:
  name: "Compra · Luxemburgo ciudad"
  min_price: 150000         # €; por debajo se descarta (evita mezclar alertas de alquiler)
  max_price: 1100000        # €; anuncios por encima se descartan
  min_rooms: 2              # dormitorios
  min_surface: 55           # m²; por debajo se descartan
  max_age_days: 120         # anuncios vistos por primera vez hace más se ocultan

# Lugar de referencia para el trayecto (línea recta).
# Coordenadas aproximadas de tu trabajo en Capellen; ajústalas si quieres precisión.
# Ojo: este nombre aparece en listings.json, que es público si el repo lo es.
work:
  label: "Trabajo (Capellen)"
  lat: 49.6466
  lon: 5.9893

scoring:
  # Pesos de cada componente (se normalizan, no hace falta que sumen 1)
  weights:
    value: 0.40     # €/m² frente a la referencia de la zona
    size: 0.20      # superficie frente a la ideal
    commute: 0.25   # distancia al trabajo
    extras: 0.15    # terraza, planta, bajadas de precio…
  ideal_surface: 95         # m² con los que "size" llega a 100
  max_commute_km: 20        # a esta distancia "commute" vale 0

  # €/m² de referencia por zona. Si una zona no está, se usa la mediana
  # de todos los anuncios que ha visto la app. Puedes rellenarlo con los
  # datos del Observatoire de l'Habitat para tener una referencia externa.
  reference_eur_m2: {}
  #   Kirchberg: 11800
  #   Limpertsberg: 13000

  # Palabras en título o descripción y su efecto sobre "extras" (base 50).
  # Terraza, balcón, jardín, parking y ascensor ya suman solos.
  keywords:
    "dernier étage": 10
    penthouse: 10
    "nouvelle construction": 4
    "rez-de-chaussée": -15
    "à rénover": -12
    viager: -40

notify:
  # Barrios de los avisos de pisos nuevos y bajadas (lista vacía [] = todos).
  # Los guardados avisan de bajadas, retiradas y compromisos estén donde estén.
  zones: ["Limpertsberg"]
  # Chollo: aviso destacado si un piso nuevo o rebajado queda al menos este
  # porcentaje por debajo de la mediana de su barrio, o supera esta puntuación
  deal_discount: 0.15
  deal_score: 85
  deal_zones: []            # [] = los mismos barrios de arriba
  # Solo avisa de anuncios nuevos con al menos esta puntuación
  min_score: 0
  # Cuántos aparecen destacados en el resumen
  top_n: 5

details:
  # Ficha completa (clase energética, gastos, año, terraza…) de: barrios de
  # los avisos, guardados y los mejor puntuados de toda la ciudad
  top_n: 25
  refresh_days: 7
  budget: { full: 80, quick: 25 }   # fichas máximas por escaneo

sources:
  # Escaneo completo (cada mañana) frente a rápido (botón de la app):
  # número máximo de páginas de resultados que se leen de cada portal.
  pages:
    full: { athome: 60, wortimmo: 45, trovit: 20 }
    quick: { athome: 3, wortimmo: 3, trovit: 4 }

  athome:
    enabled: true
    # búsqueda: compra, pisos, commune de Luxemburgo, hasta 1,1 M€, 2+ dormitorios, más recientes primero
    url: "https://www.athome.lu/srp/?tr=buy&q=d8380e34&ptypes=flat,4,7,5,6,42,32,41,43&price_max=1100000&bedrooms_min=2&sort=date_desc"

  wortimmo:
    enabled: true
    url: "https://www.wortimmo.lu/fr/vente/appartement/centre/luxembourg?qs%5BlocationId%5D=90&qs%5BpriceTo%5D=1100000&qs%5BbedroomsFrom%5D=2"

  trovit:
    enabled: true
    # agregador: recoge Immotop y webs de agencias; se filtra por ciudad al leer
    url: "https://immo.trovit.lu/index.php/cod.search_homes/type.1/what_d.luxembourg/rooms_min.2/price_max.1100000/order_by.source_date/resultsPerPage.25/isUserSearch.1"
    city: "Luxembourg"

  immotop_email:
    enabled: true
    sender: "alerts.immotop.lu"
    lookback_days: 120        # primera ejecución: cuánto historial leer
    resolve_links: false

  geocoding:
    use_nominatim: true       # geocodifica calles/zonas desconocidas (OpenStreetMap)
